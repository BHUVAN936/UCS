{% extends "base.html" %}

{% block title %}
Register | UCE Connect
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="container auth-wrap">

        <div class="auth-card">

            <span class="eyebrow">
                UCE CONNECT
            </span>

            <h1>
                Create account.
            </h1>

            <p>
                Register for access to the university information portal.
            </p>


            <form
                method="POST"
                action="{{ url_for('main.register') }}"
                class="auth-form"
            >

                <label>
                    Full Name

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </label>


                <label>
                    Email

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </label>


                <label>
                    Account Type

                    <select
                        name="role"
                        id="registerRole"
                        required
                    >

                        <option value="user">
                            Student / User
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                    </select>

                </label>


                <div
                    id="adminCodeGroup"
                    class="admin-code-group"
                    hidden
                >

                    <label>
                        Admin Registration Code

                        <input
                            type="password"
                            name="admin_code"
                            id="adminCode"
                            placeholder="Enter admin registration code"
                            autocomplete="off"
                        >
                    </label>

                    <small>
                        Admin accounts require the authorized registration code.
                    </small>

                </div>


                <label>
                    Password

                    <input
                        type="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </label>


                <label>
                    Confirm Password

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </label>


                <button
                    class="primary-button auth-submit"
                    type="submit"
                >
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a
                    href="{{ url_for('main.login') }}"
                >
                    Login
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
